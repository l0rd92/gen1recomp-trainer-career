name: Bug report
description: Report something that is broken or recorded incorrectly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Trainer Career. Never attach ROMs or private save files.
  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - Pokémon Red
        - Pokémon Blue
        - Pokémon Yellow
        - Unknown / not game-specific
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: List the shortest sequence of actions that triggers the problem.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Trainer Career and Gen1Recomp versions or commit hashes, if known.
  - type: textarea
    id: mods
    attributes:
      label: Other enabled mods
      description: List other mods that were enabled, if any.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not attached a ROM or a private save file.
          required: true
